name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Kodlari İndir
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Kutuphaneleri Yukle
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: EXE Olustur
      run: pyinstaller --onefile --name "PresiyometreRapor" --add-data "templates;templates" --add-data "static;static" --console app.py

    - name: EXE Dosyasini İndirilebilir Yap
      uses: actions/upload-artifact@v4
      with:
        name: PresiyometreRapor-EXE
        path: dist/PresiyometreRapor.exe
